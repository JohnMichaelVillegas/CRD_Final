{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student - CRD Case Management System</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        :root {
            --theme-color: {{ settings.theme_color|default:"#15803d" }};
        }

        .theme-bg {
            background-color: var(--theme-color);
        }

        .theme-text {
            color: var(--theme-color);
        }

        .theme-border {
            border-color: var(--theme-color);
        }

        .theme-hover:hover {
            opacity: 0.9;
        }

    </style>

</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="theme-bg text-white px-6 py-4 shadow">

        <div class="flex justify-between items-center">

            <div>

                <h1 class="text-xl font-bold">
                    CRD Case Management System
                </h1>

                <p class="text-sm opacity-90">
                    Edit Student Record
                </p>

            </div>

            <a
                href="{% url 'student_records' %}"
                class="bg-white text-gray-700 px-4 py-2 rounded-lg font-medium hover:bg-gray-100"
            >
                Back to Student Records
            </a>

        </div>

    </header>


    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-6 py-8">

        <div class="bg-white rounded-xl shadow p-6">

            <h2 class="text-2xl font-bold text-gray-800 mb-6">
                Edit Student
            </h2>


            <form
                method="POST"
                enctype="multipart/form-data"
            >

                {% csrf_token %}


                <!-- Profile Picture -->
                <div class="mb-6">

                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Profile Picture
                    </label>

                    <div class="flex items-center gap-5">

                        {% if student.image %}

                            <img
                                src="{{ student.image.url }}"
                                alt="Student Profile"
                                class="w-24 h-24 rounded-full object-cover border"
                            >

                        {% else %}

                            <div
                                class="w-24 h-24 rounded-full bg-gray-200 flex items-center justify-center text-gray-500"
                            >
                                No Image
                            </div>

                        {% endif %}


                        <div>

                            <input
                                type="file"
                                name="image"
                                id="image"
                                accept="image/*"
                                class="block w-full text-sm text-gray-700"
                            >

                            <p class="text-xs text-gray-500 mt-1">
                                Choose a new image only if you want to change the current picture.
                            </p>

                        </div>

                    </div>

                </div>


                <!-- Student ID -->
                <div class="mb-4">

                    <label
                        for="student_id"
                        class="block text-sm font-medium text-gray-700 mb-1"
                    >
                        Student ID
                    </label>

                    <input
                        type="text"
                        name="student_id"
                        id="student_id"
                        value="{{ student.student_id }}"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-600"
                    >

                </div>


                <!-- First Name -->
                <div class="mb-4">

                    <label
                        for="first_name"
                        class="block text-sm font-medium text-gray-700 mb-1"
                    >
                        First Name
                    </label>

                    <input
                        type="text"
                        name="first_name"
                        id="first_name"
                        value="{{ student.first_name }}"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-600"
                    >

                </div>


                <!-- Last Name -->
                <div class="mb-4">

                    <label
                        for="last_name"
                        class="block text-sm font-medium text-gray-700 mb-1"
                    >
                        Last Name
                    </label>

                    <input
                        type="text"
                        name="last_name"
                        id="last_name"
                        value="{{ student.last_name }}"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-600"
                    >

                </div>


                <!-- Course -->
                <div class="mb-4">

                    <label
                        for="course"
                        class="block text-sm font-medium text-gray-700 mb-1"
                    >
                        Course
                    </label>

                    <input
                        type="text"
                        name="course"
                        id="course"
                        value="{{ student.course }}"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-600"
                    >

                </div>


                <!-- Program -->
                <div class="mb-4">

                    <label
                        for="program"
                        class="block text-sm font-medium text-gray-700 mb-1"
                    >
                        Program
                    </label>

                    <input
                        type="text"
                        name="program"
                        id="program"
                        value="{{ student.program }}"
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-600"
                    >

                </div>


                <!-- Year Level -->
                <div class="mb-4">

                    <label
                        for="year_level"
                        class="block text-sm font-medium text-gray-700 mb-1"
                    >
                        Year Level
                    </label>

                    <input
                        type="text"
                        name="year_level"
                        id="year_level"
                        value="{{ student.year_level }}"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-600"
                    >

                </div>


                <!-- Sex -->
                <div class="mb-6">

                    <label
                        for="sex"
                        class="block text-sm font-medium text-gray-700 mb-1"
                    >
                        Sex
                    </label>

                    <select
                        name="sex"
                        id="sex"
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-600"
                    >

                        <option value="">
                            Select Sex
                        </option>

                        <option
                            value="Male"
                            {% if student.sex == "Male" %}selected{% endif %}
                        >
                            Male
                        </option>

                        <option
                            value="Female"
                            {% if student.sex == "Female" %}selected{% endif %}
                        >
                            Female
                        </option>

                    </select>

                </div>


                <!-- Buttons -->
                <div class="flex justify-end gap-3">

                    <a
                        href="{% url 'student_records' %}"
                        class="px-5 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="theme-bg text-white px-5 py-2 rounded-lg font-medium theme-hover"
                    >
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </main>

</body>

</html>

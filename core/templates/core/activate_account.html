{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Activate Account - CRD</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --theme-color: {{ settings.theme_color|default:"#15803d" }};
    }

    .theme-bg {
      background-color: var(--theme-color) !important;
    }
  </style>

</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-5">

  <main class="w-full max-w-md">

<div class="bg-white rounded-3xl shadow-xl border border-slate-200 p-8">

  <div class="text-center mb-7">

    <div class="theme-bg mx-auto flex h-16 w-16 items-center justify-center rounded-2xl text-white text-2xl font-bold">
      CRD
    </div>

    <h1 class="text-2xl font-bold text-slate-800 mt-5">
      Activate Your Account
    </h1>

    <p class="text-sm text-slate-500 mt-2">
      Enter the activation code provided by the Main Admin and create your password.
    </p>

  </div>

  {% if error %}
    <div class="mb-5 p-3 rounded-xl bg-red-100 text-red-700 text-sm">
      {{ error }}
    </div>
  {% endif %}

  <form method="POST" class="space-y-4">
    {% csrf_token %}

    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">
        Username
      </label>

      <input
        type="text"
        name="username"
        required
        autocomplete="username"
        class="w-full border border-slate-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-green-600"
        placeholder="Enter your username"
      >
    </div>

    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">
        Five-Digit Activation Code
      </label>

      <input
        type="text"
        name="activation_code"
        required
        inputmode="numeric"
        pattern="[0-9]{5}"
        maxlength="5"
        minlength="5"
        autocomplete="off"
        class="w-full border border-slate-300 rounded-xl p-3 tracking-widest"
        placeholder="Enter your code"
      >
    </div>

    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">
        Create Password
      </label>

      <input
        type="password"
        name="password"
        required
        minlength="8"
        autocomplete="new-password"
        class="w-full border border-slate-300 rounded-xl p-3"
        placeholder="At least 8 characters"
      >
    </div>

    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">
        Confirm Password
      </label>

      <input
        type="password"
        name="confirm_password"
        required
        minlength="8"
        autocomplete="new-password"
        class="w-full border border-slate-300 rounded-xl p-3"
        placeholder="Re-enter your password"
      >
    </div>

    <button
      type="submit"
      class="w-full py-3 text-white rounded-xl theme-bg hover:opacity-90 font-semibold"
    >
      Activate Account
    </button>

  </form>

  <div class="text-center mt-6">
    <a
      href="{% url 'login' %}"
      class="text-sm text-slate-500 hover:text-slate-800"
    >
      Back to Login
    </a>
  </div>

</div>

  </main>

</body>
</html>
